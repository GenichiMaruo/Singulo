// Minecraft 1.21.1 の Forge 版のビルド。ソースは本体（../src）の NeoForge 版を正とし、ビルドのたびに Forge 向けに変換してから
// コンパイルする（../src を直接は変えない）。使い方（リポジトリのルートで）: ./gradlew -p forge build
//
// 変換の順番:
//   1. 書き分け: //#if neoforge … //#else … //#endif の、neoforge の側を捨て、else の側の「//$ 」を外して使う
//   2. 名前の置き換え（forge/rules.txt。正規表現 → 置き換え）
//   3. 差し替え: forge/src/main/java にある同じ場所のファイルを、本体のファイルの代わりに使う
//   4. 除外: Forge 版にない連携（Mekanism）は入れない
plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

// 版などは本体の gradle.properties を共有する
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
shared.each { k, v -> project.ext.set(k as String, v) }

version = mod_version
group = mod_group_id
base { archivesName = mod_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def root = file('..')
def mainJava = [new File(root, 'src/main/java'), new File(root, 'src/generated/java')]
def guiReview = providers.gradleProperty('guiReview').map { it.toBoolean() }.getOrElse(false)
if (guiReview) mainJava.add(new File(root, 'tools/review/gui-src'))
def mainResources = [new File(root, 'src/main/resources'), new File(root, 'src/generated/resources')]
def overlayJava = file('src/main/java')
def rulesFile = file('rules.txt')
def preJava = layout.buildDirectory.dir('preprocessed/java')
def preResources = layout.buildDirectory.dir('preprocessed/resources')
// Forge 版に入れないもの（本体からの相対パスの先頭）
def excluded = ['io/github/genichimaruo/singulo/compat/mekanism/', 'io/github/genichimaruo/singulo/test/MekanismGameTests.java']

/** 書き分けと名前の置き換え。 */
def transform = { String text, List rules ->
    def out = new StringBuilder()
    def mode = 'both'           // both / neo（neoforge の側。捨てる）/ forge（else の側。「//$ 」を外す）
    text.eachLine { line ->
        def t = line.trim()
        if (t.startsWith('//#if neoforge')) { mode = 'neo'; return }
        if (t.startsWith('//#else') && mode == 'neo') { mode = 'forge'; return }
        if (t.startsWith('//#endif') && mode != 'both') { mode = 'both'; return }
        if (mode == 'neo') { return }
        if (mode == 'forge') {
            def i = line.indexOf('//$ ')
            line = i >= 0 ? line.substring(0, i) + line.substring(i + 4) : line
        }
        out.append(line).append('\n')
    }
    def s = out.toString()
    rules.each { r -> s = s.replaceAll(r[0], r[1]) }
    s
}

def loadRules = {
    def rules = []
    rulesFile.eachLine('UTF-8') { line ->
        if (line.trim().isEmpty() || line.startsWith('#')) return
        def parts = line.split(' => ', 2)
        rules << [parts[0], parts.length > 1 ? parts[1] : '']
    }
    rules
}

def preprocessJava = tasks.register('preprocessJava') {
    inputs.property('guiReview', guiReview)
    inputs.files(mainJava).withPropertyName('main')
    inputs.dir(overlayJava).withPropertyName('overlay')
    inputs.file(rulesFile)
    outputs.dir(preJava)
    doLast {
        def out = preJava.get().asFile
        project.delete(out)
        out.mkdirs()
        def rules = loadRules()
        def overlay = [] as Set
        overlayJava.eachFileRecurse(groovy.io.FileType.FILES) { overlay << overlayJava.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        mainJava.each { dir ->
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                if (!rel.endsWith('.java') || rel in overlay || excluded.any { rel.startsWith(it) }) return
                def target = new File(out, rel)
                target.parentFile.mkdirs()
                target.setText(transform(f.getText('UTF-8'), rules), 'UTF-8')
            }
        }
        project.copy { from overlayJava; into out }
    }
}

def preprocessResources = tasks.register('preprocessResources') {
    inputs.files(mainResources).withPropertyName('main')
    inputs.dir('src/main/templates')
    inputs.dir('src/main/resources')
    outputs.dir(preResources)
    doLast {
        def out = preResources.get().asFile
        project.delete(out)
        out.mkdirs()
        def jsonRules = [
                ['"neoforge_data"', '"forge_data"'],
                ['"neoforge:mod_loaded"', '"forge:mod_loaded"'],
                ['"neoforge:composite"', '"forge:composite"'],
                ['"neoforge:separate_transforms"', '"forge:separate_transforms"'],
                ['"neoforge:components"', '"singulo:components"'],     // forgecompat.ComponentsIngredient
        ]
        mainResources.each { dir ->
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                def target = new File(out, rel)
                target.parentFile.mkdirs()
                if (rel.endsWith('.json')) {
                    def s = f.getText('UTF-8')
                    // 読み込みの条件: NeoForge は配列（"neoforge:conditions": [ … ]）、Forge は1つ（"forge:condition": { … }）
                    s = s.replaceAll(/"neoforge:conditions":\s*\[\s*(\{[^\[\]]*?\})\s*\]/, '"forge:condition": $1')
                    s = s.replaceAll(/"neoforge:conditions":\s*\[([^\[\]]*?)\]/, '"forge:condition": {"type": "forge:and", "values": [$1]}')
                    jsonRules.each { r -> s = s.replace(r[0], r[1]) }
                    target.setText(s, 'UTF-8')
                } else {
                    java.nio.file.Files.copy(f.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
        def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range, forge_version: forge_version,
                     loader_version_range: forge_loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                     mod_version: mod_version, mod_authors: mod_authors]
        project.copy {
            from 'src/main/templates'
            into out
            expand props
        }
        // Forge 版だけの資源（Forge に無い共通タグ c:… を、Forge の forge:… へつなぐ）
        project.copy {
            from 'src/main/resources'
            into out
        }
    }
}

sourceSets.main.java.srcDirs = [preJava]
sourceSets.main.resources.srcDirs = [preResources]
tasks.named('compileJava') { dependsOn preprocessJava }
tasks.named('processResources') { dependsOn preprocessResources }

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformers = files(new File(root, 'src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.enableGameTest', 'true'
        }
        register('client') {
            if (guiReview) {
                workingDir = layout.projectDirectory.dir('build/gui-review')
                systemProperty 'singulo.guiReviewOutput', file('build/gui-review/screenshots').absolutePath
                args '--quickPlaySingleplayer', 'Review', '--width', '1280', '--height', '800'
            }
        }
        register('server') { args '--nogui' }
        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('build/gametest')
            systemProperty 'singulo.gameTestTickRate', providers.gradleProperty('testTickRate').getOrElse('200')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_name}-${mod_version}-${minecraft_version}F.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// Prevent stale worlds or successful logs from masking an early server exit.
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.buildDirectory.dir('gametest/world')
    delete layout.buildDirectory.file('gametest/logs/latest.log')
}
tasks.named('runGameTestServer') { dependsOn cleanGameTestWorld }
