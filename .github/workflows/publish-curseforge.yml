name: Publish CurseForge Beta

# Publish only artifacts from a successful validation of the exact tagged tree.
# Tag creation alone never uploads a duplicate or triggers another full build.
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Successful validation run covering both 1.20.1 loaders'
        required: true
        type: string
      release_tag:
        description: 'Existing immutable v<version>-1.20.1F or N tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    environment: curseforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version, loader and changelog
        id: version
        shell: bash
        working-directory: release-source
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          case "$RELEASE_TAG" in
            *-1.20.1F|*-1.20.1F-r*) loader=forge; suffix=F ;;
            *-1.20.1N|*-1.20.1N-r*) loader=neoforge; suffix=N ;;
            *) echo 'Invalid 1.20.1 loader tag'; exit 1 ;;
          esac
          # verified_release.py independently enforces the full version/tag match.
          test "$minecraft" = 1.20.1
          test -f "docs/curseforge/changelog-$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$mod_name-$version-$minecraft$suffix" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
      - name: Validate source and resources
        working-directory: release-source
        run: |
          python tools/localization.py --check
          python tools/check_models.py
          python tools/check_supporters.py
          python tools/check_advancements.py
          python tools/check_recipe_parity.py
          python tools/check_port_1201.py
      - name: Verify CI provenance and immutable tag
        id: verified
        run: python3 tools/verified_release.py check --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
          pattern: ${{ steps.verified.outputs.pattern }}
          path: verified-artifacts
      - name: Promote the validated production JAR
        env:
          JAR_NAME: ${{ steps.version.outputs.name }}.jar
        run: |
          python3 tools/verified_release.py promote --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source --output "release-artifacts/$JAR_NAME"
          python3 release-source/tools/check_port_1201.py --jar "release-artifacts/$JAR_NAME"
      - name: Reserve release tag without distributing a GitHub JAR
        env:
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "release-source/docs/curseforge/changelog-$MOD_VERSION.md" release-notes.md
          cat >> release-notes.md <<'NOTES'

          Download the mod from CurseForge: https://www.curseforge.com/minecraft/mc-mods/singulo/files
          NOTES
          # Keep the asset-free draft on upload failure to prevent duplicate uploads.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --latest=false --title "$RELEASE_NAME (Beta)" --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: release-artifacts/${{ steps.version.outputs.name }}.jar
          if-no-files-found: error
      - name: Publish Beta to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ steps.version.outputs.name }}.jar
          name: ${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog-file: release-source/docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: ${{ steps.version.outputs.loader }}
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: '17'
          dependencies: |
            jei(optional)
            mekanism(optional)
          fail-mode: fail
      - name: Publish release notes with CurseForge download link only
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
