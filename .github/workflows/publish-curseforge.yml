name: Publish CurseForge

# Promote the tested JARs; creating a tag alone never rebuilds or uploads.
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Successful PR validation with NeoForge, complete GUI and Sodium/DH lighting'
        required: true
        type: string
      release_tag:
        description: 'Existing immutable v<mod_version> tag'
        required: true
        type: string
      release_type:
        description: 'auto: Beta for 0.x; Release for stable versions 1.0.0 and later'
        type: choice
        options: [auto, beta, release, alpha]
        default: auto

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: curseforge
    permissions:
      contents: write
      actions: read
    env:
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REQUESTED_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
          path: release-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and changelog
        id: version
        working-directory: release-source
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          [[ "$RELEASE_TAG" == "v$version-26.1.2N" && "$minecraft" == 26.1.2 ]] || exit 1
          test -f "docs/curseforge/changelog-$version.md"
          type="$REQUESTED_TYPE"
          if [[ "$type" == auto ]]; then
            if [[ "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] && (( BASH_REMATCH[1] >= 1 )); then type=release; else type=beta; fi
          fi
          [[ "$type" == beta || "$type" == release || "$type" == alpha ]] || exit 1
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "neo_name=$mod_name-$version-${minecraft}N" >> "$GITHUB_OUTPUT"
      - name: Verify CI provenance and exact tagged source
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verified_release_2612.py check --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - name: Download both digest-verified CI evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verified_release_2612.py download --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - name: Install trusted PNG checker dependency
        run: python3 -m pip install -r tools/review/requirements.txt
      - name: Promote the validated production JAR without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verified_release_2612.py promote --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - name: Acquire permanent shared CurseForge upload lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/curseforge_guard.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$(git -C release-source rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --receipt cf-lock-receipt.json
      - name: Reserve an asset-free release audit record
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.version.outputs.type }}
        run: |
          cp "release-source/docs/curseforge/changelog-$VERSION.md" release-notes.md
          cat >> release-notes.md <<'NOTES'

          Download the NeoForge JAR from CurseForge: https://www.curseforge.com/minecraft/mc-mods/singulo/files
          NOTES
          prerelease=--prerelease
          if [[ "$TYPE" == release ]]; then prerelease=--prerelease=false; fi
          # A failed upload keeps this draft: inspect CF before attempting any retry.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "$prerelease" --latest=false --title "Singulo $VERSION" --notes-file release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ steps.version.outputs.version }}-26.1.2
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish NeoForge to CurseForge
        id: publish_cf
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ steps.version.outputs.neo_name }}.jar
          name: ${{ steps.version.outputs.neo_name }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: release-source/docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: neoforge
          game-versions: '26.1.2'
          java: '25'
          dependencies: |
            jei(optional)
          # An accepted upload can still return 5xx; never retry that POST automatically.
          retry-attempts: 1
          fail-mode: fail
      - name: Record accepted or uncertain CurseForge publication
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish_cf.outcome }}
          CF_PROJECT: ${{ steps.publish_cf.outputs.curseforge-id }}
          CF_VERSION: ${{ steps.publish_cf.outputs.curseforge-version }}
          CF_URL: ${{ steps.publish_cf.outputs.curseforge-url }}
          CF_FILES: ${{ steps.publish_cf.outputs.curseforge-files }}
          EXPECTED_FILE: ${{ steps.version.outputs.neo_name }}.jar
        run: python3 tools/cf_publication_receipt.py
      - name: Retain CurseForge publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cf-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: cf-publication-receipt.json
          if-no-files-found: error
      - name: Publish release notes with CurseForge links only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Retain permanent CF lock intent
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cf-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: cf-lock-receipt.json
          if-no-files-found: ignore
