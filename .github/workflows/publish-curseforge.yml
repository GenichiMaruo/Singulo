name: Publish CurseForge

# 公開の種類（release type）:
#   auto（既定）: 版番号が 1.0.0 以上で、-alpha / -beta / -rc などの付かない正式な版なら Release、それ以外（0.x や 1.0.0-beta.1）は Beta
#   手動実行では beta / release / alpha を選んで上書きできる
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'CurseForge release type (auto: Release for 1.0.0 and later without a pre-release suffix, otherwise Beta)'
        type: choice
        options: [auto, beta, release, alpha]
        default: auto

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: curseforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and changelog
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          suffix=$(sed -n 's/^mod_loader_suffix=//p' gradle.properties | tr -d '\r')
          [[ "$suffix" == N ]] || { echo 'This workflow publishes NeoForge builds (N)'; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag must match mod_version'; exit 1
          fi
          test -f "docs/curseforge/changelog-$version.md"
          type="${{ inputs.release_type }}"
          if [[ -z "$type" || "$type" == auto ]]; then
            if [[ "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] && (( BASH_REMATCH[1] >= 1 )); then
              type=release
            else
              type=beta
            fi
          fi
          echo "Release type: $type"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$mod_name-$version-$minecraft$suffix" >> "$GITHUB_OUTPUT"
          echo "forge_name=$mod_name-$version-${minecraft}F" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
      - name: Validate translations
        run: python tools/localization.py --check
      - name: Build and run GameTests
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" build runGameTestServer
      - name: Build the Forge version and run GameTests
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -p forge --no-configuration-cache build runGameTestServer
          grep -E 'All [1-9][0-9]* required tests passed' forge/build/gametest/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            build/libs/${{ steps.version.outputs.name }}.jar
            forge/build/libs/${{ steps.version.outputs.forge_name }}.jar
          if-no-files-found: error
      - name: Publish to CurseForge (${{ steps.version.outputs.type }})
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.version.outputs.name }}.jar
          name: ${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: '21'
          dependencies: jei(optional)
          fail-mode: fail
      - name: Publish the Forge version to CurseForge (${{ steps.version.outputs.type }})
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/${{ steps.version.outputs.forge_name }}.jar
          name: ${{ steps.version.outputs.forge_name }}
          version: ${{ steps.version.outputs.version }}-forge
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: forge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: '21'
          dependencies: jei(optional)
          fail-mode: fail
