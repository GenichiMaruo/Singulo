name: Publish CurseForge and GitHub Beta

on:
  push:
    tags: ['v*-1.20.1N', 'v*-1.20.1N-r*']
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Successful PR validation run to promote without rebuilding'
        required: false
        type: string
      release_tag:
        description: 'Existing immutable tag matching the verified CI tree'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_DIR: ${{ inputs.verified_run_id != '' && 'release-source' || '.' }}
      GH_TOKEN: ${{ github.token }}
    environment: curseforge
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.verified_run_id != ''
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and changelog
        id: version
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [[ -n "$VERIFIED_RUN_ID" && -z "$RELEASE_TAG" || -z "$VERIFIED_RUN_ID" && -n "$RELEASE_TAG" ]]; then
            echo 'verified_run_id and release_tag must be supplied together'; exit 1
          fi
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          suffix=$(sed -n 's/^mod_loader_suffix=//p' gradle.properties | tr -d '\r')
          [[ "$suffix" == N ]] || { echo 'This workflow publishes NeoForge builds (N)'; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag || -n "$RELEASE_TAG" ]]; then
            tag_name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            tag_prefix="v$version-$minecraft$suffix"
            retry_suffix="${tag_name#"$tag_prefix"}"
            if [[ "$tag_name" != "$tag_prefix" && ( "$retry_suffix" == "$tag_name" || ! "$retry_suffix" =~ ^-r[1-9][0-9]*$ ) ]]; then
              echo 'Tag must match the version, Minecraft and loader, optionally followed by -r<number>'
              exit 1
            fi
          fi
          test -f "docs/curseforge/changelog-$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$mod_name-$version-$minecraft$suffix" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
      - name: Validate source and resources
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          python tools/localization.py --check
          python tools/check_models.py
          python tools/check_supporters.py
          python tools/check_advancements.py
          python tools/check_recipe_parity.py
          python tools/check_port_1201.py
      - name: Build and run GameTests
        if: inputs.verified_run_id == ''
        run: |
          chmod +x gradlew
          mkdir -p build/reports/gametest
          for namespace in singulo singulo_automation singulo_reactor singulo_prototype singulo_progression singulo_lab; do
            ./gradlew --no-daemon --max-workers=2 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 -PtestNamespace="$namespace" build runGameTestServer
            cp build/gametest/logs/latest.log "build/reports/gametest/$namespace.log"
          done
          python3 tools/check_port_1201.py --jar "build/libs/${{ steps.version.outputs.name }}.jar"
      - name: Verify CI provenance and immutable tag
        id: verified
        if: inputs.verified_run_id != ''
        run: python3 tools/verified_release.py check --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - uses: actions/download-artifact@v4
        if: inputs.verified_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
          pattern: ${{ steps.verified.outputs.pattern }}
          path: verified-artifacts
      - name: Promote the validated production JAR
        if: inputs.verified_run_id != ''
        env:
          JAR_NAME: ${{ steps.version.outputs.name }}.jar
        run: |
          python3 tools/verified_release.py promote --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source --output "build/libs/$JAR_NAME"
          python3 release-source/tools/check_port_1201.py --jar "build/libs/$JAR_NAME"
      - name: Stage release to prevent duplicate promotion uploads
        if: inputs.verified_run_id != ''
        env:
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "build/libs/$RELEASE_NAME.jar" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "$RELEASE_NAME (Beta)" --notes-file "release-source/docs/curseforge/changelog-$MOD_VERSION.md"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: build/libs/${{ steps.version.outputs.name }}.jar
          if-no-files-found: error
      - name: Publish Beta to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.version.outputs.name }}.jar
          name: ${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog-file: ${{ env.SOURCE_DIR }}/docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: '17'
          dependencies: |
            jei(optional)
            mekanism(optional)
          fail-mode: fail

  github-release:
    needs: publish
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.name }}
          path: dist
      - name: Publish version-specific GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.publish.outputs.name }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          if [[ -n "$VERIFIED_RUN_ID" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            exit 0
          fi
          gh release create "$RELEASE_TAG" "dist/$RELEASE_NAME.jar" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_NAME (Beta)" \
            --notes-file "docs/curseforge/changelog-$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r').md" \
            --prerelease --latest=false
