name: Publish CurseForge

# Promote the tested JARs; creating a tag alone never rebuilds or uploads.
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Successful PR validation with NeoForge, GUI and Mekanism'
        required: true
        type: string
      release_tag:
        description: 'Existing immutable v<mod_version> tag'
        required: true
        type: string
      release_type:
        description: 'auto: Beta for 0.x; Release for stable versions 1.0.0 and later'
        type: choice
        options: [auto, beta, release, alpha]
        default: auto

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: curseforge
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REQUESTED_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and changelog
        id: version
        working-directory: release-source
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mod_name=$(sed -n 's/^mod_name=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          [[ "$RELEASE_TAG" == "v$version" && "$minecraft" == 1.21.1 ]] || exit 1
          test -f "docs/curseforge/changelog-$version.md"
          type="$REQUESTED_TYPE"
          if [[ "$type" == auto ]]; then
            if [[ "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] && (( BASH_REMATCH[1] >= 1 )); then type=release; else type=beta; fi
          fi
          [[ "$type" == beta || "$type" == release || "$type" == alpha ]] || exit 1
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "neo_name=$mod_name-$version-${minecraft}N" >> "$GITHUB_OUTPUT"
      - name: Verify CI provenance and exact tagged source
        id: verified
        run: python3 tools/verified_release_1211.py check --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
          name: ${{ steps.verified.outputs.neoforge_artifact }}
          path: verified-artifacts/${{ steps.verified.outputs.neoforge_artifact }}
      - name: Promote the validated production JAR without rebuilding
        run: python3 tools/verified_release_1211.py promote --repo "$GITHUB_REPOSITORY" --run "$VERIFIED_RUN_ID" --tag "$RELEASE_TAG" --source release-source
      - name: Reserve an asset-free release to guard duplicate uploads
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.version.outputs.type }}
        run: |
          cp "release-source/docs/curseforge/changelog-$VERSION.md" release-notes.md
          cat >> release-notes.md <<'NOTES'

          Download the NeoForge JAR from CurseForge: https://www.curseforge.com/minecraft/mc-mods/singulo/files
          NOTES
          prerelease=--prerelease
          if [[ "$TYPE" == release ]]; then prerelease=--prerelease=false; fi
          # A failed upload keeps this draft: inspect CF before attempting any retry.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "$prerelease" --latest=false --title "Singulo $VERSION" --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ steps.version.outputs.version }}-1.21.1
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish NeoForge to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ steps.version.outputs.neo_name }}.jar
          name: ${{ steps.version.outputs.neo_name }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: release-source/docs/curseforge/changelog-${{ steps.version.outputs.version }}.md
          loaders: neoforge
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            jei(optional)
            mekanism(optional)
          fail-mode: fail
      - name: Publish release notes with CurseForge links only
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
