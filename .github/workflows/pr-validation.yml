name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer -PtestTickRate=20
      - name: Require a completed nonempty successful GameTest run
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          log = pathlib.Path("build/gametest/logs/latest.log")
          if not log.is_file() or not re.search(r"All [1-9][0-9]* required tests passed", log.read_text(encoding="utf-8")):
              raise SystemExit("GameTestServer did not report successful nonempty completion")
          PY
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/gametest/logs/
            build/reports/
