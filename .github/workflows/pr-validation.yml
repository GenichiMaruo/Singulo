name: PR validation

on:
  pull_request:
    branches: [1.21.1, main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate translations and models
        run: |
          python3 tools/localization.py --check
          python3 tools/check_models.py
          python3 tools/check_advancements.py
          python3 tools/check_supporters.py
          python3 tools/test_release_1211.py
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer -PtestTickRate=200
      - name: Require all NeoForge GameTests
        run: python3 tools/check_release_1211.py --loader neoforge --build-dir build
      - name: Check production JAR excludes GUI harness
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile
          jars = list(pathlib.Path("build/libs").glob("*.jar"))
          if not jars:
              raise SystemExit("No production JAR found")
          for path in jars:
              with zipfile.ZipFile(path) as jar:
                  if any("GuiReviewHarness" in name or "Stage6ReviewHarness" in name for name in jar.namelist()):
                      raise SystemExit("Development GUI harness leaked into " + str(path))
          PY
      - name: Prepare disposable GUI review world
        run: python3 tools/review/prepare_gui.py
      - name: Run real client GUI smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle runClient
      - name: Require GUI captures
        run: |
          test "$(ls build/gui-review/screenshots/*.png | wc -l)" -eq 20
          grep -q 'SINGULO_GUI_COMPLETE 20' build/gui-review/logs/latest.log
          grep -q 'SINGULO_SEARCH_COMPLETE' build/gui-review/logs/latest.log
          grep -q 'SINGULO_JEI_SYNC_COMPLETE' build/gui-review/logs/latest.log
      - name: Verify inventory pixels in exported PNGs
        run: python3 tools/review/check_gui_png.py
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/gametest/logs/
            build/reports/
            build/gui-review/screenshots/
            build/gui-review/logs/
            build/gui-review/inventory-pixels.json

  optional-mekanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run optional chemical integration tests against real Mekanism
        run: bash ./gradlew --no-daemon --max-workers=2 runGameTestServer -PwithMekanism -PtestNamespace=singulo_mekanism
      - name: Require completed nonempty integration tests
        run: grep -E 'All 1 required tests passed' build/gametest/logs/latest.log
      - name: Save integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mekanism-validation-${{ github.sha }}
          path: build/gametest/logs/
