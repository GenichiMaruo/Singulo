name: PR validation

on:
  pull_request:
    branches: [1.21.1, main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate translations and models
        run: |
          python3 tools/localization.py --check
          python3 tools/check_gameplay_text.py
          python3 tools/check_models.py
          python3 tools/check_advancements.py
          python3 tools/check_supporters.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_gametests.py --inventory
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer -PtestTickRate=200
      - name: Require all NeoForge GameTests
        run: python3 tools/check_release_1211.py --loader neoforge --build-dir build
      - name: Prepare disposable GUI review world
        run: python3 tools/review/prepare_gui.py
      - name: Run real client GUI smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle runClient -PmachineGuiReview
      - name: Require GUI captures
        run: |
          test "$(ls build/gui-review/screenshots/*.png | wc -l)" -eq 242
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 220' build/gui-review/logs/latest.log
          grep -q 'SINGULO_GUI_COMPLETE 22' build/gui-review/logs/latest.log
          grep -q 'SINGULO_SEARCH_COMPLETE' build/gui-review/logs/latest.log
          grep -q 'SINGULO_HANDBOOK_SEARCH_COMPLETE' build/gui-review/logs/latest.log
          grep -q 'SINGULO_JEI_SYNC_COMPLETE' build/gui-review/logs/latest.log
      - name: Install PNG validation dependency
        run: python3 -m pip install -r tools/review/requirements.txt
      - name: Verify inventory pixels in exported PNGs
        run: python3 tools/review/check_gui_png.py
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/gametest/logs/
            build/reports/
            build/gui-review/screenshots/
            build/gui-review/logs/
            build/gui-review/inventory-pixels.json
            build/gui-review/machine-font-metrics.tsv
            build/gui-review/machine-pixels.json

  sodium-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable light review world
        run: |
          bash ./gradlew --no-daemon --max-workers=2 runGameTestServer -PtestNamespace=singulo_rayleigh
          python3 tools/check_gametests.py --namespaces singulo_rayleigh
          python3 tools/review/prepare_rayleigh.py
          python3 -m pip install -r tools/review/requirements.txt
      - name: Compare real Sodium and DH sunlight against clear noon
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rayleigh.gradle runClient -PwithSodium -PwithDistantHorizons
          grep -q 'SINGULO_SODIUM_NOON_VERTEX_COMPLETE 241' build/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_SODIUM_NOON_EMISSIVE_COMPLETE' build/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_RAYLEIGH_COMPLETE 256 4' build/rayleigh-review/logs/latest.log
          test "$(grep -c 'SINGULO_DH_LIGHTMAP_COMPLETE 256' build/rayleigh-review/logs/latest.log)" -eq 4
          grep -Fq "Resource pack 'mod/singulo' indicates the following shaders should be ignored: light.glsl" build/rayleigh-review/logs/latest.log
          if grep -q 'Resource pack: mod/singulo' build/rayleigh-review/logs/latest.log; then
            echo 'Singulo still triggers the Sodium shader compatibility warning'
            exit 1
          fi
          python3 tools/review/check_rayleigh_png.py build/rayleigh-review/screenshots
          cp build/rayleigh-review/logs/latest.log build/rayleigh-review/logs/lighting.log
      - name: Re-enter with visible Rayleigh panels in the same client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rejoin.gradle runClient -PwithSodium
          grep -q 'SINGULO_REJOIN_COMPLETE 5' build/rayleigh-review/logs/latest.log
      - name: Save Sodium lighting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-lighting-${{ github.sha }}
          path: |
            build/rayleigh-review/logs/
            build/rayleigh-review/screenshots/

  optional-mekanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run optional chemical integration tests against real Mekanism
        run: bash ./gradlew --no-daemon --max-workers=2 runGameTestServer -PwithMekanism -PtestNamespace=singulo_mekanism
      - name: Require completed nonempty integration tests
        run: |
          grep -E 'All 1 required tests passed' build/gametest/logs/latest.log
          python3 tools/check_gametests.py --namespaces singulo_mekanism
      - name: Save integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mekanism-validation-${{ github.sha }}
          path: |
            build/gametest/logs/
            build/reports/gametest/
