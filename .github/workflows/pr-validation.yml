name: PR validation

on:
  pull_request:
    branches: ['1.20.1']

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LOADER: ${{ matrix.loader }}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install GUI verification dependency
        run: python3 -m pip install -r tools/review/requirements.txt
      - name: Validate translations and models
        if: matrix.loader == 'forge'
        run: |
          python3 tools/localization.py --check
          python3 tools/check_models.py
          python3 tools/check_supporters.py
          python3 tools/check_advancements.py
          python3 tools/check_recipe_parity.py
          python3 tools/check_port_1201.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_gameplay_text.py
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew -Ploader=${{ matrix.loader }} --no-daemon --max-workers=2 build runGameTestServer -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - name: Validate exact test evidence and Java 17 production archive
        run: |
          python3 tools/check_release_1201.py --loader "$LOADER" --build-dir "build/$LOADER"
          suffix=N; if [[ "$LOADER" == forge ]]; then suffix=F; fi
          python3 tools/check_port_1201.py --jar "build/$LOADER/libs/Singulo-$(sed -n 's/^mod_version=//p' gradle.properties)-1.20.1$suffix.jar"
      - name: Prepare disposable GUI review world
        run: python3 tools/review/prepare_gui.py --loader "$LOADER"
      - name: Run real client GUI smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=${{ matrix.loader }} --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle -PmachineGuiReview runClient
      - name: Require GUI captures
        run: |
          test "$(ls build/${{ matrix.loader }}/gui-review/screenshots/*.png | wc -l)" -eq 262
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 240' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_GUI_COMPLETE 22' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_SEARCH_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_JEI_SYNC_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_HANDBOOK_SEARCH_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
      - name: Verify inventory pixels in exported PNGs
        run: python3 tools/review/check_gui_png.py --loader "$LOADER"
      - name: Verify cosmic screen values and port tooltips in five languages
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_gui.py --loader "$LOADER" --cosmic
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle runClient -PmachineGuiReview -PcosmicGuiReview
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 35' build/$LOADER/cosmic-gui-review/logs/latest.log
          test "$(grep -c 'SINGULO_COSMIC_GUI_REGIONS ' build/$LOADER/cosmic-gui-review/logs/latest.log)" -eq 35
          test "$(find build/$LOADER/cosmic-gui-review/screenshots -name 'machine-*.png' | wc -l)" -eq 35
      - name: Verify JEI 15 transfer, popup input and all capacity tiers
        if: matrix.loader == 'forge'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_jei.py --loader "$LOADER"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 420s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/jei.gradle runClient
          test "$(find build/$LOADER/jei-review/screenshots -name '*.png' | wc -l)" -eq 21
          test "$(grep -c 'SINGULO_JEI_LAYOUT_COMPLETE' build/$LOADER/jei-review/logs/latest.log)" -eq 5
          test "$(grep -c 'SINGULO_CAPACITY_GUI_COMPLETE' build/$LOADER/jei-review/logs/latest.log)" -eq 15
          grep -q 'SINGULO_JEI_ALL_LAYOUTS_COMPLETE [1-9]' build/$LOADER/jei-review/logs/latest.log
          grep -q 'SINGULO_JEI_TRANSFER_COMPLETE' build/$LOADER/jei-review/logs/latest.log
          grep -q 'SINGULO_POPUP_INPUT_COMPLETE' build/$LOADER/jei-review/logs/latest.log
          grep -q 'SINGULO_DRONE_MODELS_COMPLETE 3' build/$LOADER/jei-review/logs/latest.log
      - name: Verify Create Ponder previews with Embeddium, Oculus and Alexs Caves
        if: matrix.loader == 'forge'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_ponder.py --loader "$LOADER"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 600s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/ponder.gradle -PwithEmbeddium -PwithOculus -PwithAlexsCaves runClient
          test "$(grep -c 'SINGULO_PONDER_LIGHTING_COMPLETE borrowed-level 256-pixels nested-scope exception-cleanup' build/$LOADER/ponder-review/logs/latest.log)" -eq 2
          grep -q 'SINGULO_PONDER_CAPTURE_COMPLETE create:mechanical_press' build/$LOADER/ponder-review/logs/latest.log
          grep -q 'SINGULO_PONDER_CAPTURE_COMPLETE create:chute' build/$LOADER/ponder-review/logs/latest.log
          python3 tools/review/check_ponder_png.py build/$LOADER/ponder-review/screenshots/ponder.png
          python3 tools/review/check_ponder_png.py build/$LOADER/ponder-review/screenshots/ponder-chute.png --scene create:chute
      - name: Verify fifteen gravitational lenses on a real software-rendered client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_lensing.py --build-dir "build/$LOADER"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/lensing.gradle runClient
          grep -q 'SINGULO_LENSING_MANY_COMPLETE traced=15' build/$LOADER/lensing-review/logs/latest.log
          grep -q 'SINGULO_LENSING_FRAME_TIME holes=15' build/$LOADER/lensing-review/logs/latest.log
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-validation-${{ github.sha }}-${{ matrix.loader }}-full-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/${{ matrix.loader }}/libs/*.jar
            build/${{ matrix.loader }}/gametest/logs/
            build/${{ matrix.loader }}/reports/
            build/${{ matrix.loader }}/gui-review/screenshots/
            build/${{ matrix.loader }}/gui-review/logs/
            build/${{ matrix.loader }}/gui-review/inventory-pixels.json
            build/${{ matrix.loader }}/gui-review/machine-pixels.json
            build/${{ matrix.loader }}/gui-review/machine-font-metrics.tsv
            build/${{ matrix.loader }}/cosmic-gui-review/screenshots/
            build/${{ matrix.loader }}/cosmic-gui-review/logs/
            build/${{ matrix.loader }}/cosmic-gui-review/machine-font-metrics.tsv
            build/${{ matrix.loader }}/jei-review/screenshots/
            build/${{ matrix.loader }}/jei-review/logs/
            build/${{ matrix.loader }}/ponder-review/logs/
            build/${{ matrix.loader }}/ponder-review/screenshots/
            build/${{ matrix.loader }}/lensing-review/screenshots/
            build/${{ matrix.loader }}/lensing-review/logs/

  optional-mekanism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADER: forge
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - name: Verify all four legacy chemical families with real Mekanism
        run: bash ./gradlew -Ploader=forge --no-daemon --max-workers=2 runGameTestServer -PwithMekanism -PtestNamespace=singulo_mekanism -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mekanism-validation-${{ github.sha }}-forge
          path: build/forge/gametest/logs/

  renderer-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADER: forge
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare disposable lighting world
        run: |
          bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 runGameTestServer -PtestNamespace=singulo_rayleigh -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          python3 tools/review/prepare_rayleigh.py --loader "$LOADER"
          python3 -m pip install -r tools/review/requirements.txt
      - name: Verify real Embeddium and Distant Horizons lighting
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rayleigh.gradle runClient -PwithEmbeddium -PwithDistantHorizons
          grep -q 'SINGULO_EMBEDDIUM_NOON_VERTEX_COMPLETE 241' build/$LOADER/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_EMBEDDIUM_NOON_EMISSIVE_COMPLETE' build/$LOADER/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_RAYLEIGH_COMPLETE 256 4' build/$LOADER/rayleigh-review/logs/latest.log
          test "$(grep -c 'SINGULO_DH_LIGHTMAP_COMPLETE 256' build/$LOADER/rayleigh-review/logs/latest.log)" -eq 4
          python3 tools/review/check_rayleigh_png.py build/$LOADER/rayleigh-review/screenshots
          cp build/$LOADER/rayleigh-review/logs/latest.log build/$LOADER/rayleigh-review/logs/lighting.log
      - name: Verify spindle occlusion in Fancy and Fabulous pipelines
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_occlusion.py --loader "$LOADER"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/occlusion.gradle runClient
          grep -q 'SINGULO_OCCLUSION_COMPLETE 9' build/$LOADER/occlusion-review/logs/latest.log
          test "$(grep -c 'SINGULO_OCCLUSION_RESULT' build/$LOADER/occlusion-review/logs/latest.log)" -eq 9
          test "$(find build/$LOADER/occlusion-review/screenshots -name '*.png' | wc -l)" -eq 18
      - name: Re-enter the saved panel world five times in one client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rejoin.gradle runClient -PwithEmbeddium
          grep -q 'SINGULO_REJOIN_COMPLETE 5' build/$LOADER/rayleigh-review/logs/latest.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: renderer-lighting-${{ github.sha }}-forge
          path: |
            build/forge/rayleigh-review/logs/
            build/forge/rayleigh-review/screenshots/
            build/forge/occlusion-review/logs/
            build/forge/occlusion-review/screenshots/
