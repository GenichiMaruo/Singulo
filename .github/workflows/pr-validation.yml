name: PR validation

on:
  pull_request:
    branches: [1.21.1, main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate translations and models
        run: |
          python3 tools/localization.py --check
          python3 tools/check_gameplay_text.py
          python3 tools/check_models.py
          python3 tools/check_advancements.py
          python3 tools/check_supporters.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_gametests.py --inventory
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer -PtestTickRate=200
      - name: Require all NeoForge GameTests
        run: python3 tools/check_release_1211.py --loader neoforge --build-dir build
      - name: Prepare disposable GUI review world
        run: python3 tools/review/prepare_gui.py
      - name: Run real client GUI smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle runClient -PmachineGuiReview
      - name: Require GUI captures
        run: |
          test "$(ls build/gui-review/screenshots/*.png | wc -l)" -eq 262
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 240' build/gui-review/logs/latest.log
          grep -q 'SINGULO_GUI_COMPLETE 22' build/gui-review/logs/latest.log
          grep -q 'SINGULO_SEARCH_COMPLETE' build/gui-review/logs/latest.log
          grep -q 'SINGULO_HANDBOOK_SEARCH_COMPLETE' build/gui-review/logs/latest.log
          grep -q 'SINGULO_JEI_SYNC_COMPLETE' build/gui-review/logs/latest.log
      - name: Install PNG validation dependency
        run: python3 -m pip install -r tools/review/requirements.txt
      - name: Verify inventory pixels in exported PNGs
        run: python3 tools/review/check_gui_png.py
      - name: Verify cosmic screen values and independent port tooltips in five languages
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_gui.py --cosmic
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle runClient -PmachineGuiReview -PcosmicGuiReview
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 35' build/cosmic-gui-review/logs/latest.log
          test "$(grep -c 'SINGULO_COSMIC_GUI_REGIONS ' build/cosmic-gui-review/logs/latest.log)" -eq 35
          test "$(ls build/cosmic-gui-review/screenshots/machine-*.png | wc -l)" -eq 35
      - name: Verify cosmic geometry and release shaders on resource reload
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_gui.py --cosmic-world
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/cosmic.gradle runClient
          grep -q 'SINGULO_COSMIC_COMPLETE 18' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_COSMIC_GEOMETRY_COMPLETE 144 outward quads' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_PIPE_ARROW_GEOMETRY_COMPLETE 24 external-surface cases' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_JET_GLOW_DEPTH_COMPLETE 15 view-depth/quad cases' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_COSMIC_SHADER_RELOAD_COMPLETE 2 replaced and released programs' build/cosmic-review/logs/latest.log
          test "$(ls build/cosmic-review/screenshots/cosmic-*.png | wc -l)" -eq 18
      - name: Verify opaque occlusion across Fancy and Fabulous graphics
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_occlusion.py
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/occlusion.gradle runClient
          grep -q 'SINGULO_OCCLUSION_COMPLETE 9' build/occlusion-review/logs/latest.log
      - name: Verify fifteen gravitational lenses on a real software-rendered client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_lensing.py
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/lensing.gradle runClient
          grep -q 'SINGULO_LENSING_MANY_COMPLETE traced=15' build/lensing-review/logs/latest.log
          grep -q 'SINGULO_LENSING_FRAME_TIME holes=15' build/lensing-review/logs/latest.log
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-validation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/gametest/logs/
            build/reports/
            build/gui-review/screenshots/
            build/gui-review/logs/
            build/gui-review/inventory-pixels.json
            build/gui-review/machine-font-metrics.tsv
            build/gui-review/machine-pixels.json
            build/occlusion-review/screenshots/
            build/occlusion-review/logs/
            build/lensing-review/screenshots/
            build/lensing-review/logs/
            build/cosmic-gui-review/screenshots/
            build/cosmic-gui-review/logs/
            build/cosmic-review/screenshots/
            build/cosmic-review/logs/

  sodium-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare disposable light review world
        run: |
          bash ./gradlew --no-daemon --max-workers=2 runGameTestServer -PtestNamespace=singulo_rayleigh
          python3 tools/check_gametests.py --namespaces singulo_rayleigh
          python3 tools/review/prepare_rayleigh.py
          python3 -m pip install -r tools/review/requirements.txt
      - name: Compare real Sodium and DH sunlight against clear noon
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rayleigh.gradle runClient -PwithSodium -PwithDistantHorizons
          grep -q 'SINGULO_SODIUM_NOON_VERTEX_COMPLETE 241' build/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_SODIUM_NOON_EMISSIVE_COMPLETE' build/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_RAYLEIGH_COMPLETE 256 4' build/rayleigh-review/logs/latest.log
          test "$(grep -c 'SINGULO_DH_LIGHTMAP_COMPLETE 256' build/rayleigh-review/logs/latest.log)" -eq 4
          grep -Fq "Resource pack 'mod/singulo' indicates the following shaders should be ignored: light.glsl" build/rayleigh-review/logs/latest.log
          if grep -q 'Resource pack: mod/singulo' build/rayleigh-review/logs/latest.log; then
            echo 'Singulo still triggers the Sodium shader compatibility warning'
            exit 1
          fi
          python3 tools/review/check_rayleigh_png.py build/rayleigh-review/screenshots
          cp build/rayleigh-review/logs/latest.log build/rayleigh-review/logs/lighting.log
      - name: Re-enter with visible Rayleigh panels in the same client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rejoin.gradle runClient -PwithSodium
          grep -q 'SINGULO_REJOIN_COMPLETE 5' build/rayleigh-review/logs/latest.log
      - name: Verify real Create Ponder preview and lightmap state restoration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_ponder.py
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/ponder.gradle runClient -PwithSodium
          grep -q 'SINGULO_PONDER_LIGHTING_COMPLETE borrowed-level 256-pixels nested-scope exception-cleanup' build/ponder-review/logs/latest.log
          grep -q 'SINGULO_PONDER_CAPTURE_COMPLETE' build/ponder-review/logs/latest.log
          python3 tools/review/check_ponder_png.py
      - name: Verify cosmic effects and shader reload with Sodium and Distant Horizons
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          python3 tools/review/prepare_gui.py --cosmic-world
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s bash ./gradlew --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/cosmic.gradle runClient -PwithSodium -PwithDistantHorizons
          grep -q 'SINGULO_COSMIC_COMPLETE 18' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_PIPE_ARROW_GEOMETRY_COMPLETE 24 external-surface cases' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_JET_GLOW_DEPTH_COMPLETE 15 view-depth/quad cases' build/cosmic-review/logs/latest.log
          grep -q 'SINGULO_COSMIC_SHADER_RELOAD_COMPLETE 2 replaced and released programs' build/cosmic-review/logs/latest.log
      - name: Save Sodium lighting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sodium-lighting-${{ github.sha }}
          path: |
            build/rayleigh-review/logs/
            build/rayleigh-review/screenshots/
            build/ponder-review/logs/
            build/ponder-review/screenshots/
            build/cosmic-review/logs/
            build/cosmic-review/screenshots/

  optional-mekanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run optional chemical integration tests against real Mekanism
        run: bash ./gradlew --no-daemon --max-workers=2 runGameTestServer -PwithMekanism -PtestNamespace=singulo_mekanism
      - name: Require completed nonempty integration tests
        run: |
          grep -E 'All 1 required tests passed' build/gametest/logs/latest.log
          python3 tools/check_gametests.py --namespaces singulo_mekanism
      - name: Save integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mekanism-validation-${{ github.sha }}
          path: |
            build/gametest/logs/
            build/reports/gametest/
