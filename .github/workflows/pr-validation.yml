name: PR validation

on:
  pull_request:
    branches: ['1.20.1']

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LOADER: ${{ matrix.loader }}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI verification dependency
        run: python3 -m pip install -r tools/review/requirements.txt
      - name: Validate translations and models
        if: matrix.loader == 'forge'
        run: |
          python3 tools/localization.py --check
          python3 tools/check_models.py
          python3 tools/check_supporters.py
          python3 tools/check_advancements.py
          python3 tools/check_recipe_parity.py
          python3 tools/check_port_1201.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_gameplay_text.py
      - name: Build and run required GameTests
        shell: bash
        run: |
          bash ./gradlew -Ploader=${{ matrix.loader }} --no-daemon --max-workers=2 build runGameTestServer -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - name: Validate exact test evidence and Java 17 production archive
        run: |
          python3 tools/check_release_1201.py --loader "$LOADER" --build-dir "build/$LOADER"
          suffix=N; if [[ "$LOADER" == forge ]]; then suffix=F; fi
          python3 tools/check_port_1201.py --jar "build/$LOADER/libs/Singulo-$(sed -n 's/^mod_version=//p' gradle.properties)-1.20.1$suffix.jar"
      - name: Prepare disposable GUI review world
        run: python3 tools/review/prepare_gui.py --loader "$LOADER"
      - name: Run real client GUI smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=${{ matrix.loader }} --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/gui.gradle -PmachineGuiReview runClient
      - name: Require GUI captures
        run: |
          test "$(ls build/${{ matrix.loader }}/gui-review/screenshots/*.png | wc -l)" -eq 242
          grep -q 'SINGULO_MACHINE_GUI_COMPLETE 220' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_GUI_COMPLETE 22' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_SEARCH_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_JEI_SYNC_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
          grep -q 'SINGULO_HANDBOOK_SEARCH_COMPLETE' build/${{ matrix.loader }}/gui-review/logs/latest.log
      - name: Verify inventory pixels in exported PNGs
        run: python3 tools/review/check_gui_png.py --loader "$LOADER"
      - name: Save build outputs and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.sha }}-${{ matrix.loader }}-full
          if-no-files-found: warn
          path: |
            build/${{ matrix.loader }}/libs/*.jar
            build/${{ matrix.loader }}/gametest/logs/
            build/${{ matrix.loader }}/reports/
            build/${{ matrix.loader }}/gui-review/screenshots/
            build/${{ matrix.loader }}/gui-review/logs/
            build/${{ matrix.loader }}/gui-review/inventory-pixels.json
            build/${{ matrix.loader }}/gui-review/machine-pixels.json
            build/${{ matrix.loader }}/gui-review/machine-font-metrics.tsv

  optional-mekanism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADER: forge
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - name: Verify all four legacy chemical families with real Mekanism
        run: bash ./gradlew -Ploader=forge --no-daemon --max-workers=2 runGameTestServer -PwithMekanism -PtestNamespace=singulo_mekanism -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mekanism-validation-${{ github.sha }}-forge
          path: build/forge/gametest/logs/

  renderer-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADER: forge
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17.0.21
            21
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable lighting world
        run: |
          bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 runGameTestServer -PtestNamespace=singulo_rayleigh -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          python3 tools/review/prepare_rayleigh.py --loader "$LOADER"
          python3 -m pip install -r tools/review/requirements.txt
      - name: Verify real Embeddium and Distant Horizons lighting
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rayleigh.gradle runClient -PwithEmbeddium -PwithDistantHorizons
          grep -q 'SINGULO_EMBEDDIUM_NOON_VERTEX_COMPLETE 241' build/$LOADER/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_EMBEDDIUM_NOON_EMISSIVE_COMPLETE' build/$LOADER/rayleigh-review/logs/latest.log
          grep -q 'SINGULO_RAYLEIGH_COMPLETE 256 4' build/$LOADER/rayleigh-review/logs/latest.log
          test "$(grep -c 'SINGULO_DH_LIGHTMAP_COMPLETE 256' build/$LOADER/rayleigh-review/logs/latest.log)" -eq 4
          python3 tools/review/check_rayleigh_png.py build/$LOADER/rayleigh-review/screenshots
          cp build/$LOADER/rayleigh-review/logs/latest.log build/$LOADER/rayleigh-review/logs/lighting.log
      - name: Re-enter the saved panel world five times in one client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout --kill-after=30s 300s bash ./gradlew -Ploader=$LOADER --no-daemon --max-workers=2 --no-configuration-cache -I tools/review/rejoin.gradle runClient -PwithEmbeddium
          grep -q 'SINGULO_REJOIN_COMPLETE 5' build/$LOADER/rayleigh-review/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-lighting-${{ github.sha }}-forge
          path: |
            build/forge/rayleigh-review/logs/
            build/forge/rayleigh-review/screenshots/
