plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

// Resources and Java sources produced by tools/gen_data.py from recipes.py / config_spec.py.
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets.main.java.srcDir('src/generated/java')

// Compile integration fixtures separately: never ship test classes in the mod JAR.
sourceSets {
    gameTest {
        java.srcDir('src/main/java')
        java.srcDir('src/gameTest/java')
        // Narrow local reruns compile/register only these classes; full CI uses no filter.
        def selected = providers.gradleProperty('testClasses').getOrElse('').split(',').findAll { !it.isBlank() }
        if (selected.any { !(it ==~ /[A-Za-z][A-Za-z0-9]*GameTests/) }) {
            throw new GradleException('testClasses expects comma-separated GameTests class names')
        }
        for (name in selected) {
            if (name in ['MekanismGameTests', 'MekanismQioGameTests']) throw new GradleException('Mekanism integration is not part of the 26.1.2 port')
            if (fileTree('src/main/java').matching { include "**/${name}.java" }.isEmpty()
                    && fileTree('src/gameTest/java').matching { include "**/${name}.java" }.isEmpty()) {
                throw new GradleException("Unknown GameTest class: ${name}")
            }
        }
        java.include(selected.isEmpty() ? ['**/*GameTests.java'] : selected.collect { "**/${it}.java" })
        java.include('**/test/TestBuild.java', '**/test/harness/**')
        // 26.1.2 intentionally has no Mekanism integration; retain older-version fixtures on disk.
        java.exclude('**/MekanismQioGameTests.java', '**/MekanismGameTests.java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
sourceSets.main.java.exclude('**/*GameTests.java', '**/test/TestBuild.java', '**/compat/mekanism/**')
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

base {
    archivesName = mod_name
}

// Keep the normal source-set outputs intact for IDE runs and GameTests.
def compactFiles = ['**/*.class', '**/*.png', '**/*.json', '**/*.mcmeta']
def distributionDir = layout.buildDirectory.dir('distribution/compact')
def prepareDistribution = tasks.register('prepareDistribution', Sync) {
    from(sourceSets.main.output) {
        include compactFiles
        exclude 'resourcepacks/singulo_hd/**'
    }
    into distributionDir
    doLast {
        destinationDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            singulo.packaging.DistributionFiles.compact(file.toPath())
        }
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_name}-${mod_version}-${minecraft_version}${mod_loader_suffix}.jar"
    includeEmptyDirs = false
    exclude 'resourcepacks/singulo_hd/**'
    from(prepareDistribution)
    def mainDirs = sourceSets.main.output.files
    filesMatching(compactFiles) { entry ->
        if (mainDirs.any { dir -> entry.file.toPath().startsWith(dir.toPath()) }) {
            entry.exclude()
        }
    }
}

// Minecraft 26.1.2 requires Java 25; this branch is an unfinished port.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)
    addModdingDependenciesTo(sourceSets.test)


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            // -PserverDir=... で別のフォルダのワールドを使う（遺構の自己点検を、開発用のワールドを汚さずに走らせる）
            gameDirectory = project.file(providers.gradleProperty('serverDir').getOrElse('run'))
            programArgument '--nogui'
            systemProperty 'singulo.ruinSelfCheck', providers.gradleProperty('ruinSelfCheck').getOrElse('false')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // Keep tests separate from development worlds and local server settings.
            gameDirectory = project.file('build/gametest')
            // -PtestNamespace=... で一部のテストだけ走らせられる（既定は全部）
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_prototype,singulo_progression,singulo_gunner,singulo_cable,singulo_rayleigh,singulo_panel_review,singulo_scaling')
            // テストは tick で数えるので、時計を速めても結果は変わらない（-PtestTickRate=20 で普通の速さ）
            systemProperty 'singulo.gameTestTickRate', providers.gradleProperty('testTickRate').getOrElse('200')
            systemProperty 'singulo.testBenchmarks', providers.gradleProperty('testBenchmarks').getOrElse('false')
            systemProperty 'singulo.testReport', file('build/reports/gametest/results.json').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// GameTest は毎回まっさらなワールドで走らせる。テストは実行ごとに新しい場所に組まれ、前の回の場所はワールドに残る
// （世界線アンカーが読み込み続けるチャンクの反応炉・ワームホールなどが動き続け、回を重ねるほど遅く・不安定になる）。
// サーバー設定もワールドの外（config/）に残るので消す。古い版の設定（前の既定値）が残ると、CI（まっさらな状態）と違う値で走る。
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.projectDirectory.dir('build/gametest/world')
    // Minecraft 26 GameTestMain uses this new universe directory.
    delete layout.projectDirectory.dir('build/gametest/gametestserver')
    delete layout.projectDirectory.dir('build/reports/gametest')
    delete layout.projectDirectory.file('build/gametest/config/singulo-server.toml')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn cleanGameTestWorld
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JEI（レシピの表示）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }

}

configurations { sodiumBootstrap }

dependencies {
    sodiumBootstrap('maven.modrinth:sodium:zg4YQ9EL') { transitive = false }
    // Optional Sodium 0.9.2 (Minecraft 26.1.2) integration API only; never bundle or require the renderer.
    compileOnly(files(layout.buildDirectory.file('sodium-api/sodium-api.jar')).builtBy('extractSodiumApi'))
    // JEI は任意の連携。API だけでコンパイルし、開発中の起動では本体も入れる
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Registry-based 26.1 GameTests: only development resources contain this suite inventory.
def testSuiteInventoryDir = layout.buildDirectory.dir('generated/gameTest/resources')
def generateTestSuiteInventory = tasks.register('generateTestSuiteInventory') {
    def selectedNames = providers.gradleProperty('testClasses').getOrElse('').split(',').findAll { !it.isBlank() }
    def suites = files(fileTree('src/main/java') { include '**/*GameTests.java'; exclude '**/MekanismGameTests.java', '**/MekanismQioGameTests.java' },
                       fileTree('src/gameTest/java') { include '**/*GameTests.java'; exclude '**/MekanismGameTests.java', '**/MekanismQioGameTests.java' })
    inputs.files(suites)
    inputs.property('selected', selectedNames)
    outputs.file(testSuiteInventoryDir.map { it.file('singulo-test-suites.list') })
    doLast {
        def names = []
        suites.files.sort { it.path }.each { source ->
            def simpleName = source.name.substring(0, source.name.length() - 5)
            if (selectedNames.isEmpty() || selectedNames.contains(simpleName)) {
                def sourceText = source.getText('UTF-8')
                def packageMatch = sourceText =~ /(?m)^package ([\w.]+);/
                if (sourceText.contains('@GameTest(') && packageMatch.find()) {
                    names.add(packageMatch.group(1) + '.' + simpleName)
                }
            }
        }
        if (names.isEmpty()) throw new GradleException('No selected GameTest suites found')
        def destination = testSuiteInventoryDir.get().file('singulo-test-suites.list').asFile
        destination.parentFile.mkdirs()
        destination.setText(names.unique().sort().join('\n') + '\n', 'UTF-8')
    }
}
sourceSets.gameTest.resources.srcDir(testSuiteInventoryDir)
tasks.named('processGameTestResources').configure { dependsOn generateTestSuiteInventory }

// Sodium 0.9.x ships its implementation as a nested jar behind a bootstrap mod.
// Extract only that official API for compilation; never package it into Singulo.
def sodiumBootstrapArchive = configurations.sodiumBootstrap.singleFile
tasks.register('extractSodiumApi', Sync) {
    from(zipTree(sodiumBootstrapArchive)) {
        include 'META-INF/jarjar/*-mod.jar'
        eachFile { details -> details.path = 'sodium-api.jar' }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('sodium-api'))
}

// These focused headless tests have main methods rather than a test framework.
// Compile and execute them as part of check; never package them in the mod JAR.
['EnergyTransactionTest', 'PocketAttachmentMigrationTest',
 'io.github.genichimaruo.singulo.client.ClipBuffersTest',
 'io.github.genichimaruo.singulo.client.LensingMipLayoutTest'].each { testClass ->
    def taskName = 'verify' + testClass.tokenize('.').last()
    def verification = tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = testClass
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
    tasks.named('check').configure { dependsOn verification }
}

// src/test contains only explicitly executed main-method checks above, not JUnit.
// Their JavaExec tasks remain mandatory even though framework discovery is empty.
tasks.named('test', Test).configure { failOnNoDiscoveredTests = false }
