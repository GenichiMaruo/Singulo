plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

// Select one legacy loader while sharing all production sources.
def selectedLoader = providers.gradleProperty('loader').getOrElse('neoforge')
if (!(selectedLoader in ['forge', 'neoforge'])) {
    throw new GradleException('Use -Ploader=forge or -Ploader=neoforge')
}
def selectedSuffix = selectedLoader == 'forge' ? 'F' : 'N'
def selectedLoaderVersion = selectedLoader == 'forge' ? forge_version : neoforge_version
layout.buildDirectory = layout.projectDirectory.dir("build/${selectedLoader}")

version = mod_version
group = mod_group_id

// Resources and Java sources produced by tools/gen_data.py from recipes.py / config_spec.py.
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets.main.java.srcDir('src/generated/java')

// Compile integration fixtures separately: never ship test classes in the mod JAR.
sourceSets {
    gameTest {
        java.srcDir('src/main/java')
        java.srcDir('src/gameTest/java')
        // Narrow local reruns compile/register only these classes; full CI uses no filter.
        def selected = providers.gradleProperty('testClasses').getOrElse('').split(',').findAll { !it.isBlank() }
        if (selected.any { !(it ==~ /[A-Za-z][A-Za-z0-9]*GameTests/) }) {
            throw new GradleException('testClasses expects comma-separated GameTests class names')
        }
        for (name in selected) {
            if (fileTree('src/main/java').matching { include "**/${name}.java" }.isEmpty()
                    && fileTree('src/gameTest/java').matching { include "**/${name}.java" }.isEmpty()) {
                throw new GradleException("Unknown GameTest class: ${name}")
            }
        }
        java.include(selected.isEmpty() ? ['**/*GameTests.java'] : selected.collect { "**/${it}.java" })
        java.include('**/test/TestBuild.java', '**/test/harness/**')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
sourceSets.main.java.exclude('**/*GameTests.java', '**/test/TestBuild.java')
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

base {
    archivesName = mod_name
}

tasks.withType(net.neoforged.moddevgradle.legacyforge.tasks.RemapJar).configureEach {
    archiveFileName = "${mod_name}-${mod_version}-${minecraft_version}${selectedSuffix}.jar"
}

// Minecraft 1.20.1 compiles and runs with Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    if (selectedLoader == 'forge') {
        version = "${minecraft_version}-${selectedLoaderVersion}"
    } else {
        enable { neoForgeVersion = "${minecraft_version}-${selectedLoaderVersion}" }
    }

    addModdingDependenciesTo(sourceSets.gameTest)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach { gameDirectory = layout.projectDirectory.dir("run/${selectedLoader}") }
        client {
            client()
            systemProperty 'singulo.clientSmokeTest', providers.gradleProperty('clientSmokeTest').getOrElse('false')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'singulo.ruinSelfCheck', providers.gradleProperty('ruinSelfCheck').getOrElse('false')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'singulo.testReport', layout.buildDirectory.file('reports/gametest/results.json').get().asFile.absolutePath
            systemProperty 'singulo.testBenchmarks', providers.gradleProperty('testBenchmarks').getOrElse('false')
            // Keep tests separate from development worlds and local server settings.
            gameDirectory = layout.buildDirectory.dir('gametest')
            // -PtestNamespace=... で一部のテストだけ走らせられる（既定は全部）
            systemProperty 'forge.enabledGameTestNamespaces', providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_automation,singulo_reactor,singulo_prototype,singulo_progression,singulo_lab,singulo_cable,singulo_rayleigh,singulo_panel_review,singulo_scaling')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    // JEI（レシピの表示）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

repositories { maven { url = "https://modmaven.dev/"; content { includeGroup "mekanism" } } }

dependencies {
    modCompileOnly('maven.modrinth:embeddium:UTbfe5d1') { transitive = false }
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    if (providers.gradleProperty("withMekanism").isPresent()) { modRuntimeOnly "mekanism:Mekanism:${mekanism_version}" }
    // JEI は任意の連携。API だけでコンパイルし、開発中の起動では本体も入れる
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : selectedLoaderVersion,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }

// Failed fixtures must not contaminate the next test run. Development worlds are separate.
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.buildDirectory.dir('gametest/world')
    delete layout.buildDirectory.file('gametest/logs/latest.log')
    delete layout.buildDirectory.file('reports/gametest/results.json')
}
// Flat, structure-free terrain keeps fixture setup deterministic and avoids noise-world generation.
// Only the disposable GameTest directory is changed; development and player worlds are untouched.
var prepareGameTestEnvironment = tasks.register('prepareGameTestEnvironment') {
    dependsOn cleanGameTestWorld
    def directory = layout.buildDirectory.dir('gametest')
    doLast {
        def root = directory.get().asFile
        root.mkdirs()
        new File(root, 'server.properties').text = '''level-type=minecraft:flat
level-seed=0
generate-structures=false
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":120},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
'''
    }
}
tasks.named('runGameTestServer') { dependsOn prepareGameTestEnvironment }

// Validate exact registered and completed membership; bootstrap success alone proves nothing.
var verifyGameTestResults = tasks.register('verifyGameTestResults', Exec) {
    group = 'verification'
    commandLine 'python3', 'tools/check_gametests.py', '--build-dir', layout.buildDirectory.get().asFile.absolutePath,
            '--namespaces', providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_automation,singulo_reactor,singulo_prototype,singulo_progression,singulo_lab,singulo_cable,singulo_rayleigh,singulo_panel_review,singulo_scaling'),
            '--classes', providers.gradleProperty('testClasses').getOrElse('')
}
tasks.named('runGameTestServer') { finalizedBy verifyGameTestResults }

// LegacyForge provides refmap generation and remapping for production obfuscated names.
mixin {
    add sourceSets.main, 'singulo.refmap.json'
    config 'singulo.mixins.json'
}
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// The legacy loader discovers production mixins through the JAR manifest.
tasks.named('jar') { manifest.attributes('MixinConfigs': 'singulo.mixins.json') }
