plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

// Resources and Java sources produced by tools/gen_data.py from recipes.py / config_spec.py.
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets.main.java.srcDir('src/generated/java')

base {
    archivesName = mod_name
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_name}-${mod_version}-${minecraft_version}${mod_loader_suffix}.jar"
}

// Minecraft 1.21.1 ships Java 21, so compile and run with a Java 21 toolchain.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            // -PserverDir=... で別のフォルダのワールドを使う（遺構の自己点検を、開発用のワールドを汚さずに走らせる）
            gameDirectory = project.file(providers.gradleProperty('serverDir').getOrElse('run'))
            programArgument '--nogui'
            systemProperty 'singulo.ruinSelfCheck', providers.gradleProperty('ruinSelfCheck').getOrElse('false')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // Keep tests separate from development worlds and local server settings.
            gameDirectory = project.file('build/gametest')
            // -PtestNamespace=... で一部のテストだけ走らせられる（既定は全部）
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_prototype,singulo_progression,singulo_gunner,singulo_cable,singulo_rayleigh,singulo_panel_review,singulo_scaling')
            // テストは tick で数えるので、時計を速めても結果は変わらない（-PtestTickRate=20 で普通の速さ）
            systemProperty 'singulo.gameTestTickRate', providers.gradleProperty('testTickRate').getOrElse('200')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// GameTest は毎回まっさらなワールドで走らせる。テストは実行ごとに新しい場所に組まれ、前の回の場所はワールドに残る
// （世界線アンカーが読み込み続けるチャンクの反応炉・ワームホールなどが動き続け、回を重ねるほど遅く・不安定になる）。
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.projectDirectory.dir('build/gametest/world')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn cleanGameTestWorld
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JEI（レシピの表示）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    // Mekanism（化学物質のタンクアップグレード。任意の連携）
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
}

dependencies {
    // Optional Sodium 0.6.13 integration API only; never bundle or require the renderer.
    compileOnly('maven.modrinth:sodium:Pb3OXVqC') { transitive = false }
    // JEI は任意の連携。API だけでコンパイルし、開発中の起動では本体も入れる
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Mekanism も任意の連携（入っていなくても遊べる。依存関係には書かない）。API だけでコンパイルし、
    // -PwithMekanism を付けたときだけ、開発中の起動（クライアント・GameTest）に本体を入れる
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    if (providers.gradleProperty('withMekanism').isPresent()) {
        localRuntime "mekanism:Mekanism:${mekanism_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
