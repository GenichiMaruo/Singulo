plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

// Resources and Java sources produced by tools/gen_data.py from recipes.py / config_spec.py.
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets.main.java.srcDir('src/generated/java')

base {
    archivesName = mod_name
}

tasks.withType(net.neoforged.moddevgradle.legacyforge.tasks.RemapJar).configureEach {
    archiveFileName = "${mod_name}-${mod_version}-${minecraft_version}${mod_loader_suffix}.jar"
}

// Minecraft 1.20.1 compiles and runs with Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'singulo.clientSmokeTest', providers.gradleProperty('clientSmokeTest').getOrElse('false')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'singulo.ruinSelfCheck', providers.gradleProperty('ruinSelfCheck').getOrElse('false')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // Keep tests separate from development worlds and local server settings.
            gameDirectory = project.file('build/gametest')
            // -PtestNamespace=... で一部のテストだけ走らせられる（既定は全部）
            systemProperty 'forge.enabledGameTestNamespaces', providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_automation,singulo_reactor,singulo_prototype,singulo_progression,singulo_lab')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // JEI（レシピの表示）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

repositories { maven { url = "https://modmaven.dev/"; content { includeGroup "mekanism" } } }

dependencies {
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    if (providers.gradleProperty("withMekanism").isPresent()) { modRuntimeOnly "mekanism:Mekanism:${mekanism_version}" }
    // JEI は任意の連携。API だけでコンパイルし、開発中の起動では本体も入れる
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }

// Failed fixtures must not contaminate the next test run. Development worlds are separate.
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.buildDirectory.dir('gametest/world')
    delete layout.buildDirectory.file('gametest/logs/latest.log')
}
tasks.named('runGameTestServer') { dependsOn cleanGameTestWorld }

// Minecraft's bootstrap can exit with status 0 before running any tests. Require the completion report.
var selectedGameTestNamespace = providers.gradleProperty('testNamespace').getOrElse('singulo,singulo_automation,singulo_reactor,singulo_prototype,singulo_progression,singulo_lab')
var gameTestResultLog = layout.buildDirectory.file('gametest/logs/latest.log')
var verifyGameTestResults = tasks.register('verifyGameTestResults') {
    group = 'verification'
    doLast {
        def log = gameTestResultLog.get().asFile
        def result = log.isFile() ? (log.getText('UTF-8') =~ /All ([1-9][0-9]*) required tests passed/) : null
        if (result == null || !result.find()) {
            throw new GradleException('GameTestServer did not report a successful nonempty test run; inspect build/gametest/logs/latest.log')
        }
        def namespace = selectedGameTestNamespace
        def expected = ['singulo': 252, 'singulo_automation': 49, 'singulo_reactor': 21, 'singulo_prototype': 10, 'singulo_progression': 13, 'singulo_lab': 15, 'singulo_mekanism': 2][namespace]
        if (namespace == 'singulo,singulo_automation,singulo_reactor,singulo_prototype,singulo_progression,singulo_lab') expected = 360
        if (expected != null && result.group(1).toInteger() != expected) {
            throw new GradleException("Expected ${expected} required tests for ${namespace}, found ${result.group(1)}")
        }
    }
}
tasks.named('runGameTestServer') { finalizedBy verifyGameTestResults }
