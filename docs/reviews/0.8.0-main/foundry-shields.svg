<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340"><rect width="820" height="340" fill="#101923"/><g fill="#e5edf5" font-family="sans-serif"><text x="25" y="35" font-size="20">Foundry: line shields vs nominal effective HP</text><text x="25" y="58" font-size="13">Normal settings: 280 HP; excludes armor, players and awakened scaling</text><text x="25" y="104" font-size="15">0 lines / 100% damage</text><rect x="220" y="85" width="93.33333333333333" height="27" fill="#49adbb"/><text x="323.3333333333333" y="104">280</text><text x="25" y="147" font-size="15">1 lines / 80% damage</text><rect x="220" y="128" width="116.66666666666667" height="27" fill="#49adbb"/><text x="346.6666666666667" y="147">350</text><text x="25" y="190" font-size="15">2 lines / 60% damage</text><rect x="220" y="171" width="155.55555555555557" height="27" fill="#49adbb"/><text x="385.55555555555554" y="190">467</text><text x="25" y="233" font-size="15">3 lines / 40% damage</text><rect x="220" y="214" width="233.33333333333334" height="27" fill="#49adbb"/><text x="463.33333333333337" y="233">700</text><text x="25" y="276" font-size="15">4 lines / 20% damage</text><rect x="220" y="257" width="466.6666666666667" height="27" fill="#49adbb"/><text x="696.6666666666667" y="276">1400</text><text x="25" y="325" font-size="13">Break lines first. Awakened: +150% HP, one rebuild; coop adds separate scaling.</text></g></svg>