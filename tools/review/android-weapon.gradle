// Run after GameTests: gradlew --no-configuration-cache -I tools/review/android-weapon.gradle runClient
allprojects {
    afterEvaluate {
        if (!plugins.hasPlugin('net.neoforged.moddev')) return
        def reviewDir = layout.buildDirectory.dir(providers.gradleProperty('weaponReviewDirectory').getOrElse('android-weapon-review')).get().asFile
        sourceSets.main.java.srcDir(file('tools/review/android-weapon-src'))
        if (providers.gradleProperty('withSodium').isPresent()) {
            dependencies.add('localRuntime', 'maven.modrinth:sodium:zg4YQ9EL') { transitive = false }
        }
        neoForge.runs.client {
            gameDirectory = reviewDir
            systemProperty 'singulo.androidWeaponOutput', new File(reviewDir, 'screenshots').absolutePath
            systemProperty 'singulo.androidWeaponGraphics', providers.gradleProperty('weaponGraphics').getOrElse('fancy,fabulous')
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1200'
            programArgument '--height'
            programArgument '800'
        }
        tasks.named('runClient').configure {
            doFirst {
                def world = new File(reviewDir, 'saves/Review')
                def seed = file('build/gametest/gametestserver/gametestworld')
                if (!new File(world, 'data/minecraft/world_gen_settings.dat').isFile()) {
                    def metadata = new File(seed, 'data/minecraft/world_gen_settings.dat')
                    if (!metadata.isFile()) throw new GradleException('Run GameTests first to produce ' + metadata)
                    project.copy {
                        from seed
                        include 'level.dat', 'data/minecraft/world_gen_settings.dat'
                        into world
                    }
                }
                new File(reviewDir, 'options.txt').setText('''tutorialStep:none
lang:en_us
guiScale:2
maxFps:120
enableVsync:false
renderDistance:5
simulationDistance:5
pauseOnLostFocus:false
onboardAccessibility:false
soundCategory_music:0.0
bobView:false
entityShadows:false
''', 'UTF-8')
                def config = new File(reviewDir, 'config')
                config.mkdirs()
                new File(config, 'fml.toml').setText('earlyWindowControl = false\n', 'UTF-8')
            }
        }
    }
}
