// Development-only Create/Ponder reproduction. Never included in distribution JARs.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/ponder-src'))
        dependencies.add('modRuntimeOnly', 'maven.modrinth:create:8amzvn9x') { transitive = false }
        if (providers.gradleProperty('withEmbeddium').isPresent()) {
            dependencies.add('modRuntimeOnly', 'maven.modrinth:embeddium:UTbfe5d1') { transitive = false }
        }
        if (providers.gradleProperty('withOculus').isPresent()) {
            dependencies.add('modRuntimeOnly', 'maven.modrinth:oculus:iQ1SwGc3') { transitive = false }
        }
        if (providers.gradleProperty('withAlexsCaves').isPresent()) {
            dependencies.add('modRuntimeOnly', 'maven.modrinth:alexs-caves:lC8HHXOF') { transitive = false }
            dependencies.add('modRuntimeOnly', 'maven.modrinth:citadel:lTAAe4sZ') { transitive = false }
        }
        legacyForge.runs.client {
            if (providers.gradleProperty('ponderDebug').isPresent()) {
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mixin.debug.export.filter', 'net.minecraft.client.renderer.LightTexture'
            }
            gameDirectory = layout.buildDirectory.dir('ponder-review').get().asFile
            systemProperty 'singulo.ponderOutput', layout.buildDirectory.dir('ponder-review/screenshots').get().asFile.absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
