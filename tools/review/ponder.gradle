// Development-only Create/Ponder reproduction. Never included in distribution JARs.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/ponder-src'))
        if (providers.gradleProperty('ponderModsDir').isPresent()) {
            dependencies.add('localRuntime', fileTree(providers.gradleProperty('ponderModsDir').get()) { include '*.jar' })
        } else {
            dependencies.add('localRuntime', 'maven.modrinth:create:UjX6dr61') { transitive = false }
        }
        if (providers.gradleProperty('withSodium').isPresent()) {
            dependencies.add('localRuntime', 'maven.modrinth:sodium:Pb3OXVqC') { transitive = false }
        }
        neoForge.runs.client {
            gameDirectory = file('build/ponder-review')
            systemProperty 'singulo.ponderOutput', file('build/ponder-review/screenshots').absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
