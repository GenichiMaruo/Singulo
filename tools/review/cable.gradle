// Development only: exclude the client fixture from normal builds and distribution JARs.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/cable-src'))
        legacyForge.runs.client {
            gameDirectory = layout.buildDirectory.dir('gui-review').get().asFile
            systemProperty 'singulo.guiReviewOutput', layout.buildDirectory.dir('gui-review/cable-screenshots').get().asFile.absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
