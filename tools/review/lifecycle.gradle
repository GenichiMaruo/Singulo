// Dedicated loopback-only lifecycle and real two-client regression.
allprojects {
    afterEvaluate {
        if (!plugins.hasPlugin('net.neoforged.moddev.legacyforge')) return
        sourceSets.main.java.srcDir(file('tools/review/lifecycle-src'))
        def output = file(providers.gradleProperty('lifecycleOutput').get()).absolutePath
        legacyForge.runs.server {
            gameDirectory = layout.buildDirectory.dir('lifecycle-server-' + providers.gradleProperty('lifecycleRun').getOrElse('v2')).get().asFile
            systemProperty 'singulo.lifecycleServer', 'true'
            systemProperty 'singulo.cosmicLifecycle', providers.gradleProperty('cosmicLifecycle').isPresent().toString()
            systemProperty 'singulo.lifecycleOutput', output
        }
        legacyForge.runs.client {
            def role = providers.gradleProperty('reviewRole').getOrElse('A')
            gameDirectory = layout.buildDirectory.dir('lifecycle-client-' + role).get().asFile
            systemProperty 'singulo.lifecycleRole', role
            systemProperty 'singulo.lifecycleAddress', providers.gradleProperty('reviewAddress').getOrElse('127.0.0.1:25595')
            systemProperty 'singulo.lifecycleOutput', output
            programArgument '--username'
            programArgument 'Review' + role
            programArgument '--quickPlayMultiplayer'
            programArgument providers.gradleProperty('reviewAddress').getOrElse('127.0.0.1:25595')
            programArgument '--width'
            programArgument '854'
            programArgument '--height'
            programArgument '480'
        }
    }
}
