// Development-only real-lightmap and terrain capture; excluded from normal builds.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/rayleigh-src'))
        if (providers.gradleProperty('withSodium').isPresent()) {
            dependencies.add('localRuntime', 'maven.modrinth:sodium:Pb3OXVqC') { transitive = false }
        }
        if (providers.gradleProperty('withDistantHorizons').isPresent()) {
            dependencies.add('localRuntime', 'maven.modrinth:distanthorizons:9w34y8ai') { transitive = false }
        }
        if (providers.gradleProperty('rendererModsDir').isPresent()) {
            dependencies.add('localRuntime', fileTree(providers.gradleProperty('rendererModsDir').get()) { include '*.jar' })
        }
        neoForge.runs.client {
            gameDirectory = file('build/rayleigh-review')
            systemProperty 'singulo.rayleighOutput', file('build/rayleigh-review/screenshots').absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
