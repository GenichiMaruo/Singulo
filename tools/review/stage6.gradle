// Development-only visual harness; never part of ordinary build or release JARs.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/stage6-src'))
        legacyForge.runs.client {
            gameDirectory = layout.buildDirectory.dir('stage6-review').get().asFile
            systemProperty 'singulo.stage6Output', layout.buildDirectory.dir('stage6-review/screenshots').get().asFile.absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
