// Development-only: ordinary build/jar tasks never include the GUI harness.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/review/gui-src'))
        legacyForge.runs.client {
            gameDirectory = layout.buildDirectory.dir('gui-review').get().asFile
            systemProperty 'singulo.sidesGuiReview', providers.gradleProperty('sidesGuiReview').isPresent().toString()
            systemProperty 'singulo.machineGuiReview', providers.gradleProperty('machineGuiReview').isPresent().toString()
            systemProperty 'singulo.selectorGuiReview', providers.gradleProperty('selectorGuiReview').isPresent().toString()
            systemProperty 'singulo.guiReviewOutput', layout.buildDirectory.dir('gui-review/screenshots').get().asFile.absolutePath
            programArgument '--quickPlaySingleplayer'
            programArgument 'Review'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '800'
        }
    }
}
